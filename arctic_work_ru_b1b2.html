    Задания о профессиях и работе в условиях Арктики.
  </p>

  <h2 class="task-title">Задание 1. Кто это?</h2>

  <p>
    <strong>Прочитайте описание и выберите подходящую профессию.</strong>
  </p>

  <form id="quizForm"></form>

  <button type="button" onclick="checkAnswers()">Проверить ответы</button>

  <div class="result" id="result"></div>

  <script>
    const questions = [
      {
        q: "1. Кто наблюдает за погодой, измеряет температуру и скорость ветра, помогает составлять прогнозы?",
        a: "Метеоролог",
        options: [
          "Геолог",
          "Метеоролог",
          "Диспетчер"
        ]
      },
      {
        q: "2. Кто помогает людям в опасных ситуациях, участвует в поисках пропавших людей и эвакуации?",
        a: "Спасатель",
        options: [
          "Координатор",
          "Фельдшер",
          "Спасатель"
        ]
      },
      {
        q: "3. Кто перевозит людей и грузы по северным дорогам и работает в сложных погодных условиях?",
        a: "Водитель",
        options: [
          "Водитель",
          "Логист",
          "Техник"
        ]
      },
      {
        q: "4. Кто осматривает пациентов, оказывает медицинскую помощь и назначает лечение?",
        a: "Врач",
        options: [
          "Биолог",
          "Инженер",
          "Врач"
        ]
      },
      {
        q: "5. Кто проводит научные наблюдения, собирает материалы и анализирует данные об Арктике?",
        a: "Исследователь",
        options: [
          "Архивист",
          "Исследователь",
          "Экспедитор"
        ]
      },
      {
        q: "6. Кто сопровождает туристические группы, рассказывает о регионе и помогает организовать поездку?",
        a: "Гид",
        options: [
          "Гид",
          "Переводчик",
          "Администратор"
        ]
      },
      {
        q: "7. Кто работает на судне в северных морях и участвует в перевозке людей или грузов?",
        a: "Моряк",
        options: [
          "Портовый диспетчер",
          "Моряк",
          "Логист"
        ]
      },
      {
        q: "8. Кто ремонтирует машины и оборудование, если техника выходит из строя?",
        a: "Механик",
        options: [
          "Геодезист",
          "Оператор",
          "Механик"
        ]
      }
    ];

    const form = document.getElementById("quizForm");

    questions.forEach((item, index) => {
      const div = document.createElement("div");
      div.className = "quiz-question";
      div.id = `q${index + 1}-block`;

      div.innerHTML =
        `<h3>${item.q}</h3>` +
        item.options.map(option => `
          <label>
            <input
              type="radio"
              name="q${index + 1}"
              value="${option}"
            >
            ${option}
          </label>
        `).join("");

      form.appendChild(div);
    });

    function checkAnswers() {
      let score = 0;

      questions.forEach((item, index) => {
        const name = `q${index + 1}`;

        const selected =
          form.querySelector(`input[name="${name}"]:checked`);

        const block =
          document.getElementById(`${name}-block`);

        const oldFeedback =
          block.querySelector(".correct-answer");

        if (oldFeedback) {
          oldFeedback.remove();
        }

        const feedback =
          document.createElement("div");

        feedback.className = "correct-answer";

        if (!selected) {
          feedback.classList.add("incorrect");
          feedback.textContent =
            "⚠️ Сначала выберите ответ.";
        } else if (selected.value === item.a) {
          feedback.classList.add("correct");
          feedback.textContent =
            `✅ Правильно: ${item.a}`;
          score++;
        } else {
          feedback.classList.add("incorrect");
          feedback.textContent =
            `❌ Правильный ответ: ${item.a}`;
        }

        block.appendChild(feedback);
      });

      document.getElementById("result").textContent =
        `Вы правильно ответили на ${score} из ${questions.length} вопросов.`;
    }
  </script>
