    .video-hero {
  min-height: 125px;
  padding: 26px 36px;
  margin-bottom: 30px;
  box-sizing: border-box;

  display: flex;
  flex-direction: column;
  justify-content: center;

  border-radius: 14px;

  background:
    linear-gradient(
      90deg,
      rgba(248, 249, 250, 0.94) 0%,
      rgba(248, 249, 250, 0.76) 40%,
      rgba(248, 249, 250, 0.15) 72%
    ),
    url("/images/video-hero.png") center / cover no-repeat;

  box-shadow: 0 3px 14px rgba(0, 0, 0, 0.07);
  overflow: hidden;
}

.video-hero h1 {
  margin: 0 0 6px;
  color: #173f68;
  font-size: 2em;
  line-height: 1.15;
}

.video-hero p {
  margin: 0;
  color: #526170;
  font-size: 1em;
}

    .button-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 20px;
}

.button-grid a {
  position: relative;
  padding: 16px 42px 16px 18px;
  box-sizing: border-box;

  background-color: white;
  border: 1px solid #dde4ea;
  border-left: 4px solid var(--topic-color);
  border-radius: 10px;

  color: #354657;
  text-align: left;
  text-decoration: none;
  font-size: 15px;

  box-shadow: 0 2px 7px rgba(0, 0, 0, 0.04);
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}

.button-grid a::after {
  content: "›";
  position: absolute;
  right: 16px;
  top: 50%;
  transform: translateY(-52%);
  color: var(--topic-color);
  font-size: 1.5em;
}

.button-grid a:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 15px rgba(0, 0, 0, 0.08);
}

.texts {
  --topic-color: #43a047;
}

.listening {
