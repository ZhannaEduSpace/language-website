.container {

    .reading-hero {
  min-height: 125px;
  padding: 26px 36px;
  margin-bottom: 30px;
  box-sizing: border-box;

  display: flex;
  flex-direction: column;
  justify-content: center;

  border-radius: 14px;

  background:
    linear-gradient(
      90deg,
      rgba(248, 249, 250, 0.94) 0%,
      rgba(248, 249, 250, 0.76) 40%,
      rgba(248, 249, 250, 0.15) 72%
    ),
    url("/images/reading-hero.png") center / cover no-repeat;

  box-shadow: 0 3px 14px rgba(0, 0, 0, 0.07);
  overflow: hidden;
}

.reading-hero h1 {
  margin: 0 0 6px;
  color: #173f68;
  font-size: 2em;
  line-height: 1.15;
}

.reading-hero p {
  margin: 0;
  color: #526170;
  font-size: 1em;
}

    .columns {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 30px;
  align-items: start;
}

    .column {
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 20px;
}

    .column h3 {
      text-align: center;
      color: #1f4e79;
    }

  .btn {
  position: relative;
  padding: 14px 42px 14px 18px;
  border-radius: 10px;

  background-color: white;
  border: 1px solid #dde4ea;
  border-left: 4px solid var(--level-color);

  color: #354657;
  text-align: left;
  text-decoration: none;
  font-size: 15px;

  display: block;
  width: 100%;
  box-sizing: border-box;

  box-shadow: 0 2px 7px rgba(0, 0, 0, 0.04);
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}

.btn::after {
  content: "›";
  position: absolute;
  right: 16px;
  top: 50%;
  transform: translateY(-52%);
  color: var(--level-color);
  font-size: 1.5em;
}

.btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 15px rgba(0, 0, 0, 0.08);
}

.a1,
.a2,
.a1a2 {
  --level-color: #4d9b45;
}

.b1b2 {

}

.c1 {

}
