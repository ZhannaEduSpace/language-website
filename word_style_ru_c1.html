  <h3>🎓 Определите стиль слова (C1)</h3>
  <p>Отметьте стиль каждого слова: <strong>книжное</strong>, <strong>нейтральное</strong> или <strong>разговорное</strong>.</p>

  <div id="styleQuiz"></div>

  <button onclick="checkStyles()">Проверить</button>
  <div id="styleResult" style="margin-top: 20px; font-weight: bold;"></div>

  <script>
    const words = [
      { word: "ремонти́ровать", style: "нейтра́льное" },
      { word: "дры́хнуть", style: "разгово́рное" },
      { word: "каню́чить", style: "разгово́рное" },
      { word: "прекрати́ть", style: "нейтра́льное" },
      { word: "чува́к", style: "разгово́рное" },
      { word: "удрать", style: "разгово́рное" },
      { word: "измеря́ть", style: "нейтра́льное" },
      { word: "шлёпнуться", style: "разгово́рное" },
      { word: "вознаме́риться", style: "кни́жное" },
      { word: "фигня́", style: "разгово́рное" },
      { word: "воспрепя́тствовать", style: "кни́жное" },
      { word: "челове́к", style: "нейтра́льное" }
    ];

    const container = document.getElementById("styleQuiz");

    words.forEach((item, index) => {
      const block = document.createElement("div");
      block.style.marginBottom = "10px";

      block.innerHTML = `
        <label><strong>${index + 1}. ${item.word}</strong></label><br>
        <label><input type="radio" name="q${index}" value="кни́жное"> кни́жное</label>
        <label><input type="radio" name="q${index}" value="нейтра́льное" style="margin-left: 10px;"> нейтра́льное</label>
        <label><input type="radio" name="q${index}" value="разгово́рное" style="margin-left: 10px;"> разгово́рное</label>
        <span id="feedback-${index}" style="margin-left: 15px;"></span>
      `;
      container.appendChild(block);
    });

    function checkStyles() {
      let correct = 0;

      words.forEach((item, index) => {
        const selected = document.querySelector(`input[name="q${index}"]:checked`);
        const feedback = document.getElementById(`feedback-${index}`);
        feedback.innerHTML = "";

        if (!selected) {
          feedback.innerHTML = `<span style="color: red;">⚠️ Сначала выберите хотя бы один вариант.</span>`;
          return;
        }

        if (selected.value === item.style) {
          feedback.innerHTML = `<span style="color: green;">✅ Правильный ответ: ${item.style}</span>`;
          correct++;
        } else {
          feedback.innerHTML = `<span style="color: red;">❌ Правильный ответ: ${item.style}</span>`;
        }
      });

      const percent = Math.round((correct / words.length) * 100);
      document.getElementById("styleResult").innerText = `Результат: ${correct} из ${words.length} (${percent}%)`;
    }
  </script>
