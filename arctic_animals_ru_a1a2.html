  <h2 class="task-title">Задание 1. Выберите правильный ответ</h2>

  <p>
    <strong>В каждом вопросе выберите один правильный вариант.</strong>
  </p>

  <form id="quizForm"></form>

  <button type="button" onclick="checkAnswers()">Проверить ответы</button>

  <div class="result" id="result"></div>

  <script>
    const questions = [
      {
        q: "1. Како́го цве́та бе́лый медве́дь?",
        a: "Бе́лый",
        options: ["Се́рый", "Бе́лый", "Чёрный", "Ры́жий"]
      },
      {
        q: "2. Како́е живо́тное — пти́ца?",
        a: "Поля́рная сова́",
        options: ["Морж", "Тюле́нь", "Пе́сец", "Поля́рная сова́"]
      },
      {
        q: "3. Како́е живо́тное похо́же на лису́?",
        a: "Пе́сец",
        options: ["Пе́сец", "Морж", "Тюле́нь", "Се́верный оле́нь"]
      },
      {
        q: "4. У како́го живо́тного есть рога́?",
        a: "Се́верный оле́нь",
        options: ["Бе́лый медве́дь", "Пе́сец", "Се́верный оле́нь", "Тюле́нь"]
      },
      {
        q: "5. У како́го живо́тного есть больши́е бивни́?",
        a: "Морж",
        options: ["Пе́сец", "Морж", "Поля́рная сова́", "Се́верный оле́нь"]
      },
      {
        q: "6. Что есть у тюле́ня?",
        a: "Ла́сты",
        options: ["Рога́", "Кры́лья", "Копы́та", "Ла́сты"]
      },
      {
        q: "7. Что ест бе́лый медве́дь?",
        a: "Мя́со",
        options: ["Мя́со", "Я́блоки", "Хлеб", "Траву́"]
      },
      {
        q: "8. Где живёт гренла́ндский кит?",
        a: "В мо́ре",
        options: ["В го́роде", "В лесу́", "В мо́ре", "В пусты́не"]
      }
    ];

    const form = document.getElementById("quizForm");

    questions.forEach((item, i) => {
      const div = document.createElement("div");
      div.className = "quiz-question";
      div.id = `q${i + 1}-block`;

      div.innerHTML =
        `<h3>${item.q}</h3>` +
        item.options.map(option => `
          <label>
            <input type="radio" name="q${i + 1}" value="${option}">
            ${option}
          </label>
        `).join("");

      form.appendChild(div);
    });

    function checkAnswers() {
      let score = 0;

      questions.forEach((item, i) => {
        const name = `q${i + 1}`;
        const selected =
          form.querySelector(`input[name="${name}"]:checked`);

        const block =
          document.getElementById(`${name}-block`);

        const existing =
          block.querySelector(".correct-answer");

        if (existing) {
          existing.remove();
        }

        const note =
          document.createElement("div");

        note.classList.add("correct-answer");

        if (!selected) {
          note.classList.add("incorrect");
          note.textContent =
            "⚠️ Сначала выберите ответ.";
        } else if (selected.value === item.a) {
          note.classList.add("correct");
          note.textContent =
            `✅ Правильно: ${item.a}`;
          score++;
        } else {
          note.classList.add("incorrect");
          note.textContent =
            `❌ Правильный ответ: ${item.a}`;
        }

        block.appendChild(note);
      });

      document.getElementById("result").textContent =
        `Вы правильно ответили на ${score} из ${questions.length} вопросов.`;
    }
  </script>
