      <h2>✏️ НЕ и НИ в русском языке</h2>

      <p class="instruction">
        <strong>Задание 1.</strong> Впишите <strong>не</strong> или <strong>ни.</strong><br>
        Например: Я <em>не</em> видел его вчера.
      </p>

      <form id="quizForm"></form>

      <button type="button" onclick="checkAnswers()">Проверить ответы</button>

      <div class="result" id="result"></div>

      <script>
        const questions = [
          {
            q: 'Он ___ разу не пожалел о своём решении.',
            a: 'ни'
          },
          {
            q: 'Я ___ мог не согласиться с этим аргументом.',
            a: 'не'
          },
          {
            q: 'Кого он только ___ спрашивал — никто ничего не знал.',
            a: 'ни'
          },
          {
            q: 'Она ___ сказала ни слова.',
            a: 'не'
          },
          {
            q: 'Как бы он ___ старался, закончить работу вовремя не удалось.',
            a: 'ни'
          },
          {
            q: 'Это был далеко ___ лучший вариант.',
            a: 'не'
          },
          {
            q: 'Он ___ разу не нарушил данного обещания.',
            a: 'ни'
          },
          {
            q: 'Где бы мы ___ искали, нужного документа не было.',
            a: 'ни'
          },
          {
            q: 'Нельзя ___ признать, что ситуация изменилась.',
            a: 'не'
          },
          {
            q: 'Что бы он ___ предложил, коллеги находили возражения.',
            a: 'ни'
          }
        ];

        const form = document.getElementById('quizForm');

        questions.forEach((item, i) => {
          const block = document.createElement('div');
          block.className = 'quiz-question';
          block.id = `q${i + 1}-block`;

          const input = `
            <input
              type="text"
              id="input${i + 1}"
              class="answer-input"
              maxlength="2"
              autocomplete="off"
              spellcheck="false"
              aria-label="Введите не или ни"
            >
          `;

          const sentence = item.q.replace('___', input);

          block.innerHTML = `
  <p><strong>${i + 1}.</strong> ${sentence}</p>
`;

          form.appendChild(block);
        });

        function normalizeAnswer(value) {
          return value
            .trim()
            .toLowerCase();
        }

        function checkAnswers() {
          let score = 0;

          questions.forEach((item, i) => {
            const input =
              document.getElementById(`input${i + 1}`);

            const block =
              document.getElementById(`q${i + 1}-block`);

            const userAnswer =
              normalizeAnswer(input.value);

            const correctAnswer =
              item.a;

            const oldMessage =
              block.querySelector('.correct-answer');

            if (oldMessage) {
              oldMessage.remove();
            }

            const message =
              document.createElement('div');

            message.classList.add('correct-answer');

            if (userAnswer === '') {
              message.classList.add('incorrect');
              message.textContent =
                '⚠️ Сначала напишите ответ.';
            }

            else if (userAnswer === correctAnswer) {
              message.classList.add('correct');
              message.textContent =
                `✅ Правильно: ${correctAnswer}`;
              score++;
            }

            else {
              message.classList.add('incorrect');
              message.textContent =
                `❌ Правильный ответ: ${correctAnswer}`;
            }

            block.appendChild(message);
          });

          document.getElementById('result').textContent =
            `Вы правильно выполнили ${score} из ${questions.length} заданий.`;
        }
      </script>

<p class="instruction">
  <strong>Задание 2. Выберите правильную конструкцию.</strong>
</p>

<form id="quizForm2"></form>

<button type="button" onclick="checkAnswers2()">Проверить ответы</button>

<div class="result" id="result2"></div>

<script>
  const questions2 = [
    {
      before: 'Это был',
      after: ', как наш бывший преподаватель.',
      options: ['не кто иной', 'никто иной'],
      a: 'не кто иной'
    },
    {
      before: '',
      after: 'не смог бы выполнить эту работу так быстро.',
      options: ['не кто иной', 'никто иной'],
      a: 'никто иной'
    },
    {
      before: 'Решение принял',
      after: ', как директор компании.',
      options: ['не кто иной', 'никто иной'],
      a: 'не кто иной'
    },
    {
      before: '',
      after: 'не интересовало его в тот момент.',
      options: ['не что иное', 'ничто иное'],
      a: 'ничто иное'
    },
    {
      before: 'Это было',
      after: ', как попытка выиграть время.',
      options: ['не что иное', 'ничто иное'],
      a: 'не что иное'
    }
  ];

  const form2 = document.getElementById('quizForm2');

  questions2.forEach((item, i) => {
    const block = document.createElement('div');
    block.className = 'quiz-question';
    block.id = `q2-${i + 1}-block`;

    block.innerHTML = `
  <p><strong>${i + 1}.</strong> ${item.before} <span class="blank-line"></span>${item.after}</p>

  <div class="choice-options">
        ${item.options.map(option => `
          <label>
            <input
              type="radio"
              name="q2-${i + 1}"
              value="${option}"
            >
            ${option}
          </label>
        `).join('')}
      </div>
    `;

    form2.appendChild(block);
  });

  function checkAnswers2() {
    let score = 0;

    questions2.forEach((item, i) => {
      const name = `q2-${i + 1}`;

      const selected =
        form2.querySelector(`input[name="${name}"]:checked`);

      const block =
        document.getElementById(`${name}-block`);

      const oldMessage =
        block.querySelector('.correct-answer');

      if (oldMessage) {
        oldMessage.remove();
      }

      const message =
        document.createElement('div');

      message.classList.add('correct-answer');

      if (!selected) {
        message.classList.add('incorrect');
        message.textContent =
          '⚠️ Сначала выберите вариант.';
      }

      else if (selected.value === item.a) {
        message.classList.add('correct');
        message.textContent =
          `✅ Правильно: ${item.a}`;
        score++;
      }

      else {
        message.classList.add('incorrect');
        message.textContent =
          `❌ Правильный ответ: ${item.a}`;
      }

      block.appendChild(message);
    });

    document.getElementById('result2').textContent =
      `Вы правильно выполнили ${score} из ${questions2.length} заданий.`;
  }
</script>
