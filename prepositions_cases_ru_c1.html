      <h2>✏️ Предлоги и падежное управление (C1)</h2>

      <p class="instruction">
        <strong>Задание 1. Выберите правильную форму слова.</strong><br>
        Только один вариант правильный.
      </p>

      <form id="quizForm"></form>

      <button type="button" onclick="checkAnswers()">Проверить ответы</button>

      <div class="result" id="result"></div>

      <script>
        const questions = [
          {
            q: 'Согласно новому _______, сотрудники обязаны заранее уведомлять об отсутствии.',
            options: ['регламент', 'регламентом', 'регламенту'],
            a: 'регламенту'
          },
          {
            q: 'Благодаря своевременной _______ удалось избежать серьёзных последствий.',
            options: ['поддержке', 'поддержку', 'поддержки'],
            a: 'поддержке'
          },
          {
            q: 'Вопреки первоначальным _______ проект был завершён раньше срока.',
            options: ['прогнозов', 'прогнозам', 'прогнозами'],
            a: 'прогнозам'
          },
          {
            q: 'Во избежание возможных _______ организаторы изменили расписание.',
            options: ['задержкам', 'задержек', 'задержками'],
            a: 'задержек'
          },
          {
            q: 'Вследствие резкого _______ погодных условий рейс был отменён.',
            options: ['ухудшению', 'ухудшением', 'ухудшения'],
            a: 'ухудшения'
          },
          {
            q: 'Независимо от окончательного _______ комиссии решение вступит в силу в понедельник.',
            options: ['решению', 'решения', 'решением'],
            a: 'решения'
          },
          {
            q: 'Несмотря на неблагоприятную _______, участники продолжили экспедицию.',
            options: ['погоду', 'погода', 'погоде'],
            a: 'погоду'
          },
          {
            q: 'В соответствии с установленными _______ документы необходимо подать до конца месяца.',
            options: ['требования', 'требованиям', 'требованиями'],
            a: 'требованиями'
          },
          {
            q: 'В связи с техническими _______ доступ к системе временно ограничен.',
            options: ['работ', 'работам', 'работами'],
            a: 'работами'
          },
          {
            q: 'По _______ курса все участники получат сертификаты.',
            options: ['окончанию', 'окончании', 'окончанием'],
            a: 'окончании'
          }
        ];

        const form = document.getElementById('quizForm');

        questions.forEach((item, i) => {
          const block = document.createElement('div');
          block.className = 'quiz-question';
          block.id = `q${i + 1}-block`;

          block.innerHTML = `
            <p><strong>${i + 1}.</strong> ${item.q}</p>

            <div class="options">
              ${item.options.map(option => `
                <label>
                  <input
                    type="radio"
                    name="q${i + 1}"
                    value="${option}"
                  >
                  ${option}
                </label>
              `).join('')}
            </div>
          `;

          form.appendChild(block);
        });

        function checkAnswers() {
          let score = 0;

          questions.forEach((item, i) => {
            const name = `q${i + 1}`;

            const selected =
              form.querySelector(`input[name="${name}"]:checked`);

            const block =
              document.getElementById(`${name}-block`);

            const oldMessage =
              block.querySelector('.correct-answer');

            if (oldMessage) {
              oldMessage.remove();
            }

            const message =
              document.createElement('div');

            message.classList.add('correct-answer');

            if (!selected) {
              message.classList.add('incorrect');
              message.textContent =
                '⚠️ Сначала выберите вариант.';
            }

            else if (selected.value === item.a) {
              message.classList.add('correct');
              message.textContent =
                `✅ Правильно: ${item.a}`;
              score++;
            }

            else {
              message.classList.add('incorrect');
              message.textContent =
                `❌ Правильный ответ: ${item.a}`;
            }

            block.appendChild(message);
          });

          document.getElementById('result').textContent =
            `Вы правильно выполнили ${score} из ${questions.length} заданий.`;
        }
      </script>
